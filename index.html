<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDM — Videograf</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D08A;
    --gold-dim: #8B6914;
    --black: #080808;
    --black-2: #111111;
    --black-3: #1A1A1A;
    --text: #F0E8D5;
    --text-dim: #8A7A62;
  }
  html, body { height: 100%; background: var(--black); color: var(--text); font-family: 'Tenor Sans', sans-serif; overflow-x: hidden; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.5; }
  .card { position: relative; width: 100%; max-width: 400px; z-index: 1; animation: fadeUp 1s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .ornament-top { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; animation: fadeUp 1s 0.1s ease both; opacity: 0; }
  .ornament-top .line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold)); }
  .ornament-top .line.right { background: linear-gradient(to left, transparent, var(--gold)); }
  .ornament-top .dot { width: 5px; height: 5px; border: 1px solid var(--gold); transform: rotate(45deg); background: var(--gold); }
  .avatar-wrap { display: flex; justify-content: center; margin-bottom: 28px; animation: fadeUp 1s 0.2s ease both; opacity: 0; }
  .avatar { width: 90px; height: 90px; border-radius: 50%; border: 1px solid var(--gold-dim); background: var(--black-3); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .avatar::before { content: ''; position: absolute; inset: -1px; border-radius: 50%; background: conic-gradient(var(--gold), var(--gold-dim), var(--gold-light), var(--gold-dim), var(--gold)); z-index: -1; animation: spinGold 6s linear infinite; }
  @keyframes spinGold { to { transform: rotate(360deg); } }
  .avatar-inner { width: 84px; height: 84px; border-radius: 50%; background: var(--black-2); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: var(--gold); letter-spacing: 2px; }
  .name-block { text-align: center; margin-bottom: 36px; animation: fadeUp 1s 0.3s ease both; opacity: 0; }
  .name { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; letter-spacing: 8px; color: var(--text); line-height: 1; margin-bottom: 10px; text-transform: uppercase; }
  .name span { color: var(--gold); }
  .title-line { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .title-dash { width: 24px; height: 1px; background: var(--gold-dim); }
  .title { font-size: 10px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; }
  .divider { display: flex; align-items: center; gap: 8px; margin-bottom: 36px; animation: fadeUp 1s 0.4s ease both; opacity: 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim) 60%, transparent); }
  .divider-icon { font-size: 12px; color: var(--gold-dim); }
  .links { display: flex; flex-direction: column; gap: 14px; margin-bottom: 36px; }
  .link-item { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--black-2); border: 1px solid #222; border-radius: 2px; text-decoration: none; color: var(--text); position: relative; overflow: hidden; transition: border-color 0.3s, transform 0.2s; animation: fadeUp 1s ease both; opacity: 0; }
  .link-item:nth-child(1) { animation-delay: 0.5s; }
  .link-item:nth-child(2) { animation-delay: 0.6s; }
  .link-item:nth-child(3) { animation-delay: 0.7s; }
  .link-item:nth-child(4) { animation-delay: 0.8s; }
  .link-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gold); transform: scaleY(0); transition: transform 0.3s; transform-origin: bottom; }
  .link-item:hover { border-color: var(--gold-dim); transform: translateX(4px); }
  .link-item:hover::before { transform: scaleY(1); }
  .link-icon { width: 36px; height: 36px; border: 1px solid var(--gold-dim); border-radius: 2px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gold); font-size: 16px; }
  .link-info { flex: 1; }
  .link-label { font-size: 9px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 3px; }
  .link-value { font-size: 14px; color: var(--text); font-family: 'Cormorant Garamond', serif; font-weight: 400; letter-spacing: 0.5px; }
  .link-arrow { color: var(--gold-dim); font-size: 14px; transition: transform 0.2s, color 0.2s; }
  .link-item:hover .link-arrow { transform: translateX(3px); color: var(--gold); }
  .ornament-bottom { display: flex; align-items: center; gap: 12px; animation: fadeUp 1s 0.9s ease both; opacity: 0; }
  .ornament-bottom .line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim)); }
  .ornament-bottom .line.right { background: linear-gradient(to left, transparent, var(--gold-dim)); }
  .ornament-bottom .text { font-size: 8px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }
  .glow { position: fixed; width: 300px; height: 300px; background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0; }
</style>
